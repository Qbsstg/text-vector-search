name: Java verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the golden-vector JDK baseline
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.15'
          cache: maven
      - name: Run unit and acceptance tests before packaging
        run: ./mvnw -B -ntp clean verify
      - name: 设置前端测试环境
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: 验证真实请求边界与有限轮询逻辑
        run: node --test tests/frontend/*.test.mjs
      - name: 封装固定源码与校验和的候选JAR
        if: github.ref == 'refs/heads/main'
        run: python3 .github/scripts/package_release_candidate.py --expected-sha "$GITHUB_SHA"
      - name: 保存待人工批准的发布候选
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: target/release-candidate/${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/b3-process-evidence/
            target/b4-evidence/
            target/final-evidence/
          if-no-files-found: error
          retention-days: 7

