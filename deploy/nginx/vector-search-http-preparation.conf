# 证书到位前仅公开固定检查文本，不转发后端或暴露文件系统内容。
# 默认站点拒绝任意Host；部署前须确认没有其他default_server冲突。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name text.vector.search.lemoncharger.com;
    server_tokens off;
    client_max_body_size 256k;

    location = /deployment-check {
        # 精确Host再校验一次，避免绝对形式请求目标与Host头不一致。
        if ($host != text.vector.search.lemoncharger.com) { return 404; }
        # 仅允许读取固定文本，不接受写入请求。
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "stage=network-preparation\n";
    }

    # /api、H2、管理端点和所有其他路径均不提供公开代理。
    location / {
        return 404;
    }
}
