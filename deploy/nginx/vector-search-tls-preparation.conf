# 新域名只用于TLS检查；旧HTTP历史站点单独保留，不在本文件覆盖。
server {
    listen 80;
    listen [::]:80;
    server_name text-vector-search.lemoncharger.com;
    server_tokens off;

    location = /deployment-check {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "stage=tls-preparation\n";
    }
    location / { return 404; }
}

# 没有匹配SNI的连接在握手阶段拒绝，不向未知主机提供证书站点。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 404;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name text-vector-search.lemoncharger.com;
    server_tokens off;
    ssl_certificate /etc/vector-search/tls/20261023/fullchain.pem;
    ssl_certificate_key /etc/vector-search/tls/20261023/privatekey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 256k;

    # SNI匹配后仍要求HTTP Host匹配，拒绝把TLS检查站点用于其他Host。
    if ($host != text-vector-search.lemoncharger.com) { return 404; }
    location = /deployment-check {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "stage=tls-preparation\n";
    }
    # 不代理真实API，也不公开健康、H2、Actuator或任何其他路径。
    location / { return 404; }
}
