spring:
  application:
    name: vector-search
  datasource:
    # 由Spring在任务写入屏障排空后关闭连接池，避免H2的JVM退出钩子抢先关库。
    url: jdbc:h2:file:${APP_DATA_DIR:./data}/knowledge;WRITE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  h2:
    console:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 45s
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  shutdown: graceful
vector:
  worker-count: 1
  queue-capacity: 64
  max-pending-tasks: 1000
  max-documents: 5000
  search-permits: 1
  max-text-code-points: 20000
  max-request-bytes: 262144
  max-top-k: 100
  max-page-size: 100
  cpu-rounds: 32
  scan-interval-ms: 500
  scan-batch-size: 32
  shutdown-wait-seconds: 30

